<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alt Meridian · Constellation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-0: #0a0a0b;       --bg-1: #111113;       --bg-2: #16161a;
      --line: #26262c;       --line-soft: #1c1c22;
      --ink: #e8e6df;        --ink-soft: #98968e;   --ink-mute: #5a584f;
      --coral: #ff5b3c;      --coral-soft: #ff7a5c;
      --gold: #d4a85f;       --moss: #6b8f6b;
      --plum: #8b6f9b;       --sky: #5a8fa8;
    }
    html, body, #root { height: 100%; margin: 0; }
    body {
      background: var(--bg-0);
      color: var(--ink);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 12px;
      -webkit-font-smoothing: antialiased;
    }
    .display { font-family: 'Fraunces', Georgia, serif; }
    .mono    { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .eyebrow { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 9.5px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-mute); }

    /* Atmosphere — radial glow + faint film grain. Both pointer-events:none, fixed. */
    .bg-glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(60% 50% at 12% 18%, rgba(255, 91, 60, 0.05), transparent 60%),
        radial-gradient(50% 50% at 88% 82%, rgba(107, 143, 107, 0.035), transparent 60%);
    }
    .grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 100;
      opacity: 0.025; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    .panel-bg {
      background: linear-gradient(180deg, rgba(17,17,19,0.78) 0%, rgba(22,22,26,0.72) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-left: 1px solid var(--line);
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="grain"></div>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo } = React;

    /* ---------- SUPABASE ---------- */
    const SUPABASE_URL = 'https://kpecdezcolcycgpuqbgs.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwZWNkZXpjb2xjeWNncHVxYmdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2ODIyMDYsImV4cCI6MjA5MTI1ODIwNn0.rKHzdjjkYToEZWdS0ngg3Kgigh_gDWt5cRbLBCE44rg';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function sbSelect(table, q) {
      let b = sb.from(table).select('*');
      if (q?.eq) Object.entries(q.eq).forEach(([k, v]) => b = b.eq(k, v));
      const { data, error } = await b;
      if (error) throw error;
      return data || [];
    }

    const loadEngagement = (id) => sbSelect('vef_engagements', { eq: { engagement_id: id } }).then(r => r[0] || null);

    /* ---------- LOADERS (RFID-vertical fallback mirrors workspace2 @ 937777a) ---------- */
    const loadDomain      = (id) => sbSelect('vef_domains', { eq: { domain_id: id } }).then(r => r[0] || null);
    const loadSignals     = (domainId) => sbSelect('vef_value_signals', { eq: { domain_id: domainId } }).catch(() => []);
    const loadEvidence    = (domainId) => sbSelect('vef_evidence_registry', { eq: { domain_id: domainId } }).catch(() => []);
    const loadSelections  = (engId) => sbSelect('vef_scenario_selections', { eq: { engagement_id: engId } }).catch(() => []);
    const loadInputValues = async (engId) => {
      const arr = await sbSelect('vef_input_values', { eq: { engagement_id: engId } }).catch(() => []);
      const m = {}; arr.forEach(iv => m[iv.input_key] = iv); return m;
    };
    async function loadScenarios(domainId, domain) {
      let s = await sbSelect('vef_value_scenarios', { eq: { domain_id: domainId } }).catch(() => []);
      if (!s.length && domain?.technology === 'RFID' && domainId !== 'RFD')
        s = await sbSelect('vef_value_scenarios', { eq: { domain_id: 'RFD' } }).catch(() => []);
      return s;
    }
    async function loadInputDefs(domainId, domain) {
      let r = await sbSelect('vef_input_definitions', { eq: { domain_id: domainId } }).catch(() => []);
      if (!r.length && domain?.technology === 'RFID' && domainId !== 'RFD')
        r = await sbSelect('vef_input_definitions', { eq: { domain_id: 'RFD' } }).catch(() => []);
      const seen = new Set();
      return r.filter(d => seen.has(d.input_key) ? false : (seen.add(d.input_key), true));
    }

    /* ---------- GRAPH DERIVATION (structural edges only) ----------
       Three columns: Signals → Mechanisms → Levers. Theme is a node property
       on mechanisms (color band in C3), not a column — vef_value_signals has
       no value_theme FK, so signal→theme would be composed-only. Per the
       "structural or doesn't ship" rule we ship only direct-FK edges. */
    const splitCsv = (s) => (s || '').split(',').map(t => t.trim()).filter(Boolean);
    const FORMULA_STOPWORDS = new Set(['and','or','not','if','min','max','log','exp','sqrt','abs']);
    const tokenizeFormula = (f) =>
      (f || '').match(/[a-z][a-z0-9_]{2,}/g)?.filter(t => !FORMULA_STOPWORDS.has(t)) || [];

    function deriveMechLevers(scenario, defKeys, drift) {
      // Spot-check (run before this build): inputs_required is 99.4% populated
      // on the scenario side. Take the union with formula tokens and filter
      // against the loaded input_defs. Bimodal per-domain resolution against
      // vef_input_definitions is a pre-existing data-completeness state, not
      // a derivation bug — surfaced in panel structural read, not silenced.
      const declared = new Set(splitCsv(scenario.inputs_required));
      const tokens = new Set([
        ...tokenizeFormula(scenario.value_scenario_formula),
        ...tokenizeFormula(scenario.delay_cost_formula),
        ...tokenizeFormula(scenario.cost_of_inaction_formula)
      ]);
      const out = new Set();
      [...declared, ...tokens].forEach(k => { if (defKeys.has(k)) out.add(k); });
      const disagree = [...declared].some(k => !tokens.has(k) && defKeys.has(k))
        || [...tokens].some(k => !declared.has(k) && defKeys.has(k));
      if (disagree) drift.leverEdge++;
      return [...out];
    }

    function buildGraph(bundle) {
      const drift = { signalEdge: 0, leverEdge: 0 };
      const defKeys = new Set((bundle.defs || []).map(d => d.input_key));
      const selById = Object.fromEntries((bundle.selections || []).map(s => [s.scenario_id, s]));

      const mechs = (bundle.scenarios || []).map(s => ({
        kind: 'mech', id: s.scenario_id, label: s.mechanism_label || s.scenario_id,
        theme: s.value_theme || null,
        active: selById[s.scenario_id] ? selById[s.scenario_id].is_active !== false : !!s.active_by_default,
        levers: deriveMechLevers(s, defKeys, drift),
        raw: s
      }));
      const mechById = Object.fromEntries(mechs.map(m => [m.id, m]));

      const signals = (bundle.signals || []).map(sig => {
        const fromCsv = splitCsv(sig.scenario_ids);
        const fromReverse = (bundle.scenarios || [])
          .filter(s => splitCsv(s.linked_vl_nums).includes(sig.signal_id))
          .map(s => s.scenario_id);
        const union = Array.from(new Set([...fromCsv, ...fromReverse])).filter(id => mechById[id]);
        const disagree = fromCsv.some(id => !fromReverse.includes(id) && mechById[id])
          || fromReverse.some(id => !fromCsv.includes(id));
        if (disagree) drift.signalEdge++;
        return { kind: 'signal', id: sig.signal_id, label: sig.signal_name || sig.signal_id,
                 primary_lever: sig.primary_lever || null, mechIds: union, raw: sig };
      });

      const levers = (bundle.defs || []).map(d => ({
        kind: 'lever', id: d.input_key, label: d.label || d.input_key, raw: d
      }));

      // Edges with primary flag: a lever is "primary" if it appears as
      // signal.primary_lever for any signal that answers an active mechanism
      // pulling that lever (per the spec — primary is contextual to the case).
      const activeMechIds = new Set(mechs.filter(m => m.active).map(m => m.id));
      const isPrimaryLeverInCase = new Set();
      signals.forEach(sig => {
        if (!sig.primary_lever) return;
        if (sig.mechIds.some(id => activeMechIds.has(id))) isPrimaryLeverInCase.add(sig.primary_lever);
      });
      const edges = [];
      signals.forEach(sig => sig.mechIds.forEach(mid => edges.push({ from: sig.id, to: mid, kind: 'sig-mech' })));
      mechs.forEach(m => m.levers.forEach(k => edges.push({
        from: m.id, to: k, kind: 'mech-lev', primary: isPrimaryLeverInCase.has(k) && m.active
      })));

      window.__constellation_drift = drift;
      return { signals, mechs, levers, edges, drift };
    }

    /* ---------- CALC (PINNED COPY from workspace2.html @ 937777a) ----------
     * DO NOT MODIFY in this file. If a constellation case forces a change,
     * extract calc.js NOW — not later. Two divergent copies = silent lying. */
    const RAMPS = [0.5, 1.0, 1.0];
    const DISCOUNT = 0.10;

    function evalFormula(formula, inputs) {
      if (!formula || typeof formula !== 'string') return null;
      const keys = Object.keys(inputs || {});
      const vals = keys.map(k => {
        const v = inputs[k];
        return (v == null || isNaN(Number(v))) ? 0 : Number(v);
      });
      try {
        const fn = new Function(...keys, '"use strict"; return (' + formula + ');');
        const r = fn(...vals);
        return (typeof r === 'number' && isFinite(r)) ? r : null;
      } catch (_) { return null; }
    }

    function resolvedInputs(inputsMap, inputDefs) {
      const out = {};
      (inputDefs || []).forEach(d => {
        const p = inputsMap?.[d.input_key]?.provided_value;
        out[d.input_key] = p != null ? Number(p) : Number(d.typical_value ?? d.default_value ?? 0);
      });
      return out;
    }

    function computeAnalysis(scenarios, inputsMap, inputDefs) {
      const inputs = resolvedInputs(inputsMap, inputDefs);
      const per = (scenarios || []).map(s => {
        const arv = evalFormula(s.value_scenario_formula, inputs) || 0;
        const delay = evalFormula(s.delay_cost_formula, inputs) || (arv / 12);
        const coi = evalFormula(s.cost_of_inaction_formula, inputs) || (arv * 3);
        return { scenario_id: s.scenario_id, theme: s.value_theme || 'other', active: !!s.active, arv, delay, coi, pool_shadow: false };
      });
      const best = {};
      per.filter(p => p.active).forEach(p => { if (!best[p.theme] || p.arv > best[p.theme].arv) best[p.theme] = p; });
      per.forEach(p => { if (p.active && best[p.theme] && best[p.theme].scenario_id !== p.scenario_id) p.pool_shadow = true; });
      const counted = per.filter(p => p.active && !p.pool_shadow);
      const arvFull = counted.reduce((s, p) => s + p.arv, 0);
      const arvY1 = arvFull * RAMPS[0], arvY2 = arvFull * RAMPS[1], arvY3 = arvFull * RAMPS[2];
      const monthlyDelay = counted.reduce((s, p) => s + p.delay, 0);
      const coi3yr = counted.reduce((s, p) => s + p.coi, 0);
      const impl = Number(inputsMap?.implementation_cost?.provided_value) || 0;
      const npv = impl > 0 ? arvY1 + arvY2 / (1 + DISCOUNT) + arvY3 / (1 + DISCOUNT) ** 2 - impl : null;
      const payback = impl > 0 && arvY1 > 0 ? impl / (arvY1 / 12) : null;
      const bcr = impl > 0 ? (arvY1 + arvY2 + arvY3) / impl : null;
      return { arvY1, arvY2, arvY3, arvFull, monthlyDelay, coi3yr, npv, payback, bcr, perScenario: per, impl };
    }

    /* ---------- FORMAT ---------- */
    function fmtMoney(n) {
      if (n == null || !isFinite(n)) return '—';
      const a = Math.abs(n);
      if (a >= 1e9) return '$' + (n / 1e9).toFixed(1) + 'B';
      if (a >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
      if (a >= 1e3) return '$' + (n / 1e3).toFixed(0) + 'K';
      return '$' + Math.round(n).toLocaleString();
    }
    const fmtMultiple = (n) => (n == null || !isFinite(n)) ? '—' : n.toFixed(1) + '×';

    /* ---------- GLYPH ---------- */
    function StarGlyph({ size = 12, color = 'var(--coral)' }) {
      return (
        <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke={color}
             strokeWidth="1.4" strokeLinejoin="round" vectorEffect="non-scaling-stroke" aria-hidden="true">
          <path d="M8 1 L9.4 6.6 L15 8 L9.4 9.4 L8 15 L6.6 9.4 L1 8 L6.6 6.6 Z" />
        </svg>
      );
    }

    /* ---------- NARRATIVE GENERATORS ----------
       Templates that produce prose, not form fields. Branch on data shape;
       speak in real sentences with semicolons; never label what the reader
       already knows. Read aloud as written. */

    function caseNarrative({ engagement, analysis, graph, evidence }) {
      const arv = analysis?.arvFull || 0;
      const activeMechs = graph.mechs.filter(m => m.active);
      const activeSignals = graph.signals.filter(s =>
        s.mechIds.some(id => activeMechs.find(m => m.id === id))
      );
      const sorted = (analysis?.perScenario || [])
        .filter(p => p.active && !p.pool_shadow)
        .sort((a, b) => b.arv - a.arv);
      const phrases = sorted.slice(0, 3).map(p => {
        const m = graph.mechs.find(x => x.id === p.scenario_id);
        const ph = (m?.raw?.one_liner || m?.label || '').trim().replace(/\.$/, '');
        return ph.length > 0 ? ph[0].toLowerCase() + ph.slice(1) : '';
      }).filter(Boolean);
      const themes = [...new Set(activeMechs.map(m => m.theme).filter(Boolean))];
      const themeClause = themes.length === 0 ? 'operational friction'
        : themes.length === 1 ? themes[0].toLowerCase()
        : themes.length === 2 ? `${themes[0].toLowerCase()} and ${themes[1].toLowerCase()}`
        : `${themes[0].toLowerCase()}, ${themes[1].toLowerCase()}, and adjacent themes`;
      const subj = engagement.prospect_name ? `${engagement.prospect_name}'s` : 'this case\'s';

      let s1;
      if (arv > 0 && phrases.length >= 2) {
        s1 = `This case argues that ${subj} operations are losing ${fmtMoney(arv)} annually to ${themeClause} — ${phrases.join('; ')}.`;
      } else if (arv > 0) {
        s1 = `This case argues that ${subj} operations are losing ${fmtMoney(arv)} annually to ${themeClause}.`;
      } else if (activeMechs.length > 0) {
        s1 = `This case is taking shape around ${themeClause}, anchored to ${activeMechs.length} active mechanism${activeMechs.length === 1 ? '' : 's'} but not yet quantified.`;
      } else {
        s1 = `This case is at intake — no mechanisms have been activated yet.`;
      }
      const s2 = activeSignals.length > 0
        ? `${activeMechs.length} mechanism${activeMechs.length === 1 ? '' : 's'} carry the value, anchored to ${activeSignals.length} operational signal${activeSignals.length === 1 ? '' : 's'}.`
        : (activeMechs.length > 0 ? `${activeMechs.length} mechanism${activeMechs.length === 1 ? '' : 's'} carry the value.` : '');
      const stage = (engagement.deal_stage || '').toLowerCase();
      const ev = (evidence || []).length;
      const s3 = `The case is at ${stage || 'an unknown'} stage${ev > 0 ? ` with ${ev} evidence source${ev === 1 ? '' : 's'} attached` : ''}.`;
      return [s1, s2, s3].filter(Boolean).join(' ');
    }

    function structuralRead({ analysis, graph }) {
      const out = [];
      const sorted = (analysis?.perScenario || [])
        .filter(p => p.active && !p.pool_shadow).sort((a, b) => b.arv - a.arv);
      const total = analysis?.arvFull || 0;

      // Concentration
      if (sorted.length && total > 0) {
        const topPct = sorted[0].arv / total;
        const topMech = graph.mechs.find(m => m.id === sorted[0].scenario_id);
        const topName = topMech?.label || 'the top mechanism';
        if (topPct >= 0.4) {
          out.push(`${Math.round(topPct * 100)}% of annual value rests on ${topName}; the case is sensitive to changes in that mechanism's assumptions.`);
        } else if (topPct >= 0.25) {
          out.push(`${topName} carries ${Math.round(topPct * 100)}% of the value — the case leans on it without depending on it.`);
        } else {
          out.push(`Value is spread across ${sorted.length} contributing mechanisms; no single one dominates the case.`);
        }
      }

      // Evidence shape
      const active = graph.mechs.filter(m => m.active);
      const tiers = { Strong: 0, Moderate: 0, Weak: 0 };
      active.forEach(m => { const t = m.raw.evidence_strength || 'Moderate'; if (tiers[t] != null) tiers[t]++; });
      const noEv = active.filter(m => !splitCsv(m.raw.evidence_ids).length);
      let evLine = '';
      if (tiers.Strong) evLine += `${tiers.Strong} mechanism${tiers.Strong === 1 ? ' has' : 's have'} strong evidence`;
      if (tiers.Moderate) evLine += `${evLine ? '; ' : ''}${tiers.Moderate} ${tiers.Moderate === 1 ? 'is' : 'are'} moderate`;
      if (tiers.Weak) evLine += `${evLine ? '; ' : ''}${tiers.Weak} ${tiers.Weak === 1 ? 'is' : 'are'} thin`;
      if (evLine) evLine += '.';
      if (noEv.length === 1) evLine += ` ${noEv[0].label} has no evidence attached.`;
      else if (noEv.length > 1) evLine += ` ${noEv[0].label} and ${noEv.length - 1} other${noEv.length === 2 ? '' : 's'} have no evidence attached.`;
      if (evLine) out.push(evLine);

      // Lever profile (thin levers — pulled by exactly one active mech)
      const counts = {};
      active.forEach(m => m.levers.forEach(k => { counts[k] = (counts[k] || 0) + 1; }));
      const thin = Object.entries(counts).filter(([_, n]) => n === 1).map(([k]) => k);
      if (thin.length === 0 && Object.keys(counts).length > 0) {
        out.push(`Every active lever is pulled by at least two mechanisms; the case has no single-point fragilities at the input layer.`);
      } else if (thin.length > 0) {
        const ex = thin.slice(0, 2).map(k => graph.levers.find(l => l.id === k)?.label).filter(Boolean);
        const exClause = ex.length === 0 ? '' : ex.length === 1 ? ` (e.g. ${ex[0]})` : ` (e.g. ${ex[0]}; ${ex[1]})`;
        out.push(`${thin.length} lever${thin.length === 1 ? ' is' : 's are'} pulled by only one active mechanism${exClause} — fragile if those mechanisms shift.`);
      }
      return out;
    }

    /* ---------- FLOATING HEADER (top-left) ---------- */
    function FloatingHeader({ engagement, mechCount }) {
      const stage = (engagement?.deal_stage || '').toLowerCase() || '—';
      const meta = `${mechCount} mechanism${mechCount === 1 ? '' : 's'} · ${stage} stage`;
      return (
        <div className="absolute top-5 left-6 z-10 select-none">
          <div className="flex items-center gap-2">
            <a href={`workspace2.html?engagement=${encodeURIComponent(engagement?.engagement_id || '')}`}
               className="text-[var(--ink-mute)] hover:text-[var(--ink)] transition-colors text-[13px]">←</a>
            <StarGlyph size={11} />
            <span className="eyebrow">Constellation</span>
          </div>
          <div className="display mt-2.5 text-[var(--ink)]" style={{ fontSize: '22px', fontWeight: 400, lineHeight: 1.15 }}>
            {engagement?.analysis_name || engagement?.vendor_name || 'Untitled'}
          </div>
          <div className="mt-1 text-[10.5px] text-[var(--ink-mute)] tracking-wide">
            {meta}
          </div>
        </div>
      );
    }

    /* ---------- HEADLINE NUMBER (top-right, clickable in C8) ---------- */
    function HeadlineNumber({ annualValue, secondary, onTrace, traceOn }) {
      return (
        <button onClick={onTrace}
          className={`absolute top-5 z-10 text-right select-none transition-opacity ${traceOn ? 'opacity-100' : 'opacity-90 hover:opacity-100'}`}
          style={{ right: '404px' }}
          title="Click to trace contributors (C8)">
          <div className="eyebrow">Annual Value</div>
          <div className="display mt-1" style={{ fontSize: '34px', fontWeight: 300, color: 'var(--coral)', lineHeight: 1 }}>
            {fmtMoney(annualValue)}
          </div>
          <div className="mt-1.5 text-[10px] text-[var(--ink-mute)] tracking-wider">
            {secondary || 'NPV — · BCR — · CoD —'}
          </div>
        </button>
      );
    }

    /* ---------- CANVAS ----------
       Single SVG, viewBox 1400x700. Three column bands by x. Y-distribute
       nodes evenly within each band starting at y=120 to leave room for
       the floating header. Edges render before nodes (z-order). */
    const COLS = { signals: 220, mechs: 640, levers: 1100 };
    const Y_TOP = 120, Y_BOTTOM = 660;

    // Curated theme→accent map. Limited palette per spec (--coral-soft, --gold,
    // --moss, --plum, --sky). Themes outside the map fall back to ink-mute.
    const THEME_BAND = {
      'Operational Efficiency': 'var(--coral-soft)',
      'Compliance & Risk':       'var(--plum)',
      'Asset Performance':       'var(--moss)',
      'Inventory Accuracy':      'var(--sky)',
      'Throughput':              'var(--gold)',
      'Visibility':              'var(--sky)',
      'Revenue':                 'var(--moss)',
      'Labor Productivity':      'var(--gold)'
    };
    const themeBand = (t) => THEME_BAND[t] || 'var(--ink-mute)';

    // Distribute n items evenly between Y_TOP and Y_BOTTOM. Minimum spacing
    // ~64px for legibility; if n is dense, the band auto-tightens.
    function distributeY(n) {
      if (n <= 0) return [];
      if (n === 1) return [(Y_TOP + Y_BOTTOM) / 2];
      const step = (Y_BOTTOM - Y_TOP) / (n - 1);
      return Array.from({ length: n }, (_, i) => Y_TOP + i * step);
    }

    function laidOut(graph) {
      const ys = {
        signals: distributeY(graph.signals.length),
        mechs:   distributeY(graph.mechs.length),
        levers:  distributeY(graph.levers.length)
      };
      const pos = {};
      graph.signals.forEach((n, i) => pos[n.id] = { x: COLS.signals, y: ys.signals[i], col: 'signals' });
      graph.mechs.forEach((n, i) => pos[n.id]   = { x: COLS.mechs,   y: ys.mechs[i],   col: 'mechs' });
      graph.levers.forEach((n, i) => pos[n.id]  = { x: COLS.levers,  y: ys.levers[i],  col: 'levers' });
      return pos;
    }

    function Canvas({ graph, counts, hovered, onHover }) {
      const pos = useMemo(() => laidOut(graph), [graph]);
      const connected = useMemo(() => {
        const s = new Set();
        if (!hovered) return s;
        s.add(hovered);
        graph.edges.forEach(e => { if (e.from === hovered) s.add(e.to); if (e.to === hovered) s.add(e.from); });
        return s;
      }, [hovered, graph]);
      const isLit = (id) => !hovered || connected.has(id);

      // Edges: cubic bezier. Control points pulled horizontally toward midline
      // for soft S-curves that read as flow rather than wires.
      const edgePath = (a, b) => {
        const mx = (a.x + b.x) / 2;
        return `M ${a.x + 14} ${a.y} C ${mx} ${a.y}, ${mx} ${b.y}, ${b.x - 14} ${b.y}`;
      };

      return (
        <svg className="absolute inset-0" style={{ right: '380px' }}
             viewBox="0 0 1400 700" preserveAspectRatio="xMidYMid meet">
          <defs>
            <filter id="cn-glow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="2" result="b" />
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

          {/* Lane labels */}
          <g style={{ opacity: 0.4 }}>
            <text x={COLS.signals} y={90} textAnchor="middle" fill="var(--ink-mute)" fontFamily="JetBrains Mono" fontSize="9.5" letterSpacing="2.5">SIGNALS · {counts.signals}</text>
            <text x={COLS.mechs}   y={90} textAnchor="middle" fill="var(--ink-mute)" fontFamily="JetBrains Mono" fontSize="9.5" letterSpacing="2.5">MECHANISMS · {counts.mechsActive}/{counts.mechs}</text>
            <text x={COLS.levers}  y={90} textAnchor="middle" fill="var(--ink-mute)" fontFamily="JetBrains Mono" fontSize="9.5" letterSpacing="2.5">LEVERS · {counts.levers}</text>
          </g>

          {/* Edges first (under nodes) */}
          <g>
            {graph.edges.map((e, i) => {
              const a = pos[e.from], b = pos[e.to];
              if (!a || !b) return null;
              const lit = isLit(e.from) && isLit(e.to);
              const stroke = e.primary ? 'var(--coral)' : 'var(--line)';
              const sw = e.primary ? 1.6 : 1;
              const baseOpacity = e.primary ? 0.85 : 0.5;
              return <path key={i} d={edgePath(a, b)} fill="none" stroke={stroke}
                strokeWidth={sw} opacity={lit ? baseOpacity : 0.08}
                filter={e.primary ? 'url(#cn-glow)' : undefined}
                vectorEffect="non-scaling-stroke" />;
            })}
          </g>

          {/* Signal nodes (diamond) */}
          {graph.signals.map(n => {
            const p = pos[n.id]; const lit = isLit(n.id);
            return (
              <g key={n.id} opacity={lit ? 1 : 0.25} style={{ cursor: 'pointer' }}
                 onMouseEnter={() => onHover(n.id)} onMouseLeave={() => onHover(null)}>
                <polygon points={`${p.x-7},${p.y} ${p.x},${p.y-7} ${p.x+7},${p.y} ${p.x},${p.y+7}`}
                  fill="var(--bg-2)" stroke="var(--ink-soft)" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                <text x={p.x + 14} y={p.y - 2} fill="var(--ink-mute)" fontFamily="JetBrains Mono"
                      fontSize="8.5" letterSpacing="1.5">{n.id}</text>
                <text x={p.x + 14} y={p.y + 9} fill="var(--ink-soft)" fontFamily="JetBrains Mono"
                      fontSize="10">{(n.label || '').slice(0, 36)}</text>
              </g>
            );
          })}

          {/* Mechanism nodes (rounded rect with theme band) */}
          {graph.mechs.map(n => {
            const p = pos[n.id]; const lit = isLit(n.id);
            const w = 200, h = 44;
            const x0 = p.x - w/2, y0 = p.y - h/2;
            const stroke = n.active ? 'var(--coral)' : 'var(--ink-mute)';
            const fill = n.active ? 'rgba(255,91,60,0.08)' : 'transparent';
            return (
              <g key={n.id} opacity={lit ? 1 : 0.25} style={{ cursor: 'pointer' }}
                 onMouseEnter={() => onHover(n.id)} onMouseLeave={() => onHover(null)}>
                <rect x={x0} y={y0} width={w} height={h} rx="3" ry="3"
                      fill={fill} stroke={stroke} strokeWidth="1"
                      strokeDasharray={n.active ? undefined : '3 3'}
                      vectorEffect="non-scaling-stroke" />
                <rect x={x0} y={y0} width="3" height={h} fill={themeBand(n.theme)} />
                <text x={x0 + 12} y={p.y - 2} fill={n.active ? 'var(--ink)' : 'var(--ink-mute)'}
                      fontFamily="JetBrains Mono" fontSize="10.5">
                  {(n.label || '').slice(0, 32)}{(n.label || '').length > 32 ? '…' : ''}
                </text>
                <text x={x0 + 12} y={p.y + 13} fill="var(--ink-mute)" fontFamily="JetBrains Mono"
                      fontSize="8.5" letterSpacing="1.2">
                  {(n.theme || 'untyped').toUpperCase()}
                </text>
              </g>
            );
          })}

          {/* Lever nodes (circle, primary = gold + larger) */}
          {graph.levers.map(n => {
            const p = pos[n.id]; const lit = isLit(n.id);
            const isPrimary = graph.edges.some(e => e.kind === 'mech-lev' && e.to === n.id && e.primary);
            const r = isPrimary ? 11 : 9;
            const stroke = isPrimary ? 'var(--gold)' : 'var(--ink-mute)';
            const sw = isPrimary ? 1.5 : 1;
            return (
              <g key={n.id} opacity={lit ? 1 : 0.25} style={{ cursor: 'pointer' }}
                 onMouseEnter={() => onHover(n.id)} onMouseLeave={() => onHover(null)}>
                <circle cx={p.x} cy={p.y} r={r} fill="var(--bg-2)" stroke={stroke}
                        strokeWidth={sw} vectorEffect="non-scaling-stroke" />
                <text x={p.x + 16} y={p.y + 4} fill={lit ? 'var(--ink-soft)' : 'var(--ink-mute)'}
                      fontFamily="JetBrains Mono" fontSize="10">
                  {(n.label || '').slice(0, 28)}
                </text>
              </g>
            );
          })}
        </svg>
      );
    }

    /* ---------- PANEL (always visible, ~380px right) ---------- */
    function Panel({ engagement, analysis, graph, evidence }) {
      const narrative = useMemo(() => (graph && analysis)
        ? caseNarrative({ engagement, analysis, graph, evidence }) : null,
        [engagement, analysis, graph, evidence]);
      const observations = useMemo(() => (graph && analysis)
        ? structuralRead({ analysis, graph }) : [],
        [analysis, graph]);
      const stage = (engagement?.deal_stage || '').toLowerCase() || '—';
      return (
        <aside className="panel-bg absolute top-0 right-0 bottom-0 z-20 overflow-y-auto"
               style={{ width: '380px' }}>
          <div className="px-7 py-9">
            <div className="eyebrow" style={{ color: 'var(--coral)' }}>Case Read</div>
            <div className="display mt-3" style={{ fontSize: '24px', fontWeight: 400, lineHeight: 1.2 }}>
              {engagement?.analysis_name || engagement?.vendor_name || 'Untitled'}
            </div>
            <div className="mt-1.5 text-[11px] text-[var(--ink-mute)]">
              {engagement?.vendor_name || '—'} <span className="text-[var(--ink-mute)]">→</span> {engagement?.prospect_name || '—'} <span className="text-[var(--ink-mute)]">·</span> {stage}
            </div>

            {narrative && (
              <p className="mt-7 text-[12.5px] leading-[1.65] text-[var(--ink-soft)]">{narrative}</p>
            )}

            {observations.length > 0 && (
              <>
                <div className="mt-9 eyebrow">Structure</div>
                <div className="mt-3 space-y-4">
                  {observations.map((line, i) => (
                    <p key={i} className="text-[12px] leading-[1.65] text-[var(--ink-soft)]">{line}</p>
                  ))}
                </div>
              </>
            )}
          </div>
        </aside>
      );
    }

    /* ---------- SHELL ---------- */
    function ConstellationShell({ engagementId }) {
      const [bundle, setBundle] = useState(null);
      const [err, setErr] = useState(null);
      const [hovered, setHovered] = useState(null);

      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            const eng = await loadEngagement(engagementId);
            if (!eng) throw new Error(`No engagement found: ${engagementId}`);
            const domain = eng.domain_id ? await loadDomain(eng.domain_id) : null;
            const [signals, scenarios, defs, evidence, selections, values] = await Promise.all([
              loadSignals(eng.domain_id), loadScenarios(eng.domain_id, domain),
              loadInputDefs(eng.domain_id, domain), loadEvidence(eng.domain_id),
              loadSelections(engagementId), loadInputValues(engagementId)
            ]);
            if (cancelled) return;
            setBundle({ engagement: eng, domain, signals, scenarios, defs, evidence, selections, values });
          } catch (e) { if (!cancelled) setErr(e.message || String(e)); }
        })();
        return () => { cancelled = true; };
      }, [engagementId]);

      const graph = useMemo(() => bundle ? buildGraph(bundle) : null, [bundle]);
      // Reconstitute scenarios with the per-engagement active flag for the calc.
      const scenarios = useMemo(() => graph ? graph.mechs.map(m => ({ ...m.raw, active: m.active })) : [], [graph]);
      const analysis = useMemo(() =>
        bundle ? computeAnalysis(scenarios, bundle.values, bundle.defs) : null,
        [bundle, scenarios]);

      if (err) return (
        <div className="h-full grid place-items-center text-[var(--coral)] text-xs px-4 text-center">
          {err}
          <a href={`workspace2.html?engagement=${encodeURIComponent(engagementId)}`}
             className="mt-3 text-[var(--ink-mute)] hover:text-[var(--ink)] underline">← back to workspace</a>
        </div>
      );
      if (!bundle || !graph) return <div className="h-full grid place-items-center text-[var(--ink-mute)] text-xs">Loading…</div>;

      const counts = {
        signals: graph.signals.length,
        mechs: graph.mechs.length,
        mechsActive: graph.mechs.filter(m => m.active).length,
        levers: graph.levers.length
      };

      return (
        <div className="relative h-full overflow-hidden">
          <Canvas graph={graph} counts={counts} hovered={hovered} onHover={setHovered} />
          <FloatingHeader engagement={bundle.engagement} mechCount={counts.mechsActive} />
          <HeadlineNumber annualValue={analysis?.arvFull}
            secondary={`NPV ${fmtMoney(analysis?.npv)} · BCR ${fmtMultiple(analysis?.bcr)} · CoD ${fmtMoney(analysis?.monthlyDelay)}/mo`}
            onTrace={() => {}} traceOn={false} />
          <Panel engagement={bundle.engagement} analysis={analysis} graph={graph} evidence={bundle.evidence} />
        </div>
      );
    }

    function App() {
      const id = new URLSearchParams(location.search).get('engagement');
      if (!id) return (
        <div className="h-full grid place-items-center text-[var(--ink-mute)] text-xs px-4 text-center">
          No engagement specified.
          <a href="workspace2.html" className="mt-3 text-[var(--ink-mute)] hover:text-[var(--ink)] underline">← workspace</a>
        </div>
      );
      return <ConstellationShell engagementId={id} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
